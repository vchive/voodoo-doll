<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c27" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>巫柜夜场 · 把心事说给它听</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./play.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">✶</span>
          <div>
            <p class="eyebrow">HEX THEATER <span>· 夜间营业</span></p>
            <p class="brand-name">巫柜夜场</p>
          </div>
        </div>
        <span class="night-pill" id="nightPill">第 0 夜</span>
      </header>

      <div class="room-head">
        <span class="room-label" id="roomLabel">卧室</span>
        <span class="room-hint">说给它听，故事在这里发生。</span>
      </div>

      <div class="roster" id="roster" aria-label="场上的角色"></div>

      <div class="stage-wrap">
        <div id="stage"></div>
      </div>

      <div class="log" id="log" aria-live="polite"></div>

      <div class="boot hidden" id="boot"></div>

      <div class="advice hidden" id="advice"></div>

      <div class="options hidden" id="options"></div>

      <div class="report hidden" id="report"></div>

      <form class="compose" id="compose">
        <input
          id="input"
          class="compose-input"
          type="text"
          maxlength="120"
          placeholder="想让它做什么？"
          autocomplete="off"
        />
        <button class="send" id="send" type="submit" aria-label="说给它听">↗</button>
      </form>

      <div class="doll-bar">
        <div class="doll-face" id="dollFace">✶</div>
        <div>
          <p class="doll-name" id="dollNameLabel">还没有名字</p>
          <p class="doll-note">只有它能碰这间屋子里的东西。</p>
        </div>
      </div>
    </div>

    <script type="module" src="./entry.ts"></script>
  </body>
</html>
